<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi User Car Simulator</title>
  <style>html,body{margin:0;background:#07090d;color:#f2f5f8;font-family:Inter,system-ui,sans-serif}#boot{padding:24px;color:#a6b0bc}</style>
</head>
<body>
  <div id="boot">Loading garage…</div>
  <script>
  (async () => {
    const sources = [
      "https://raw.githubusercontent.com/richardjiangs/multi-user-racecar-simulator/28adc8fd90e8bd59c54cf1545c39df0faffd9e60/index.html",
      "index-offline.html"
    ];
    let html = null;
    let lastErr = null;
    for (const src of sources) {
      try {
        const r = await fetch(src, { cache: "no-store" });
        if (!r.ok) throw new Error(src + " " + r.status);
        html = await r.text();
        if (html && html.indexOf("simFrame") !== -1) break;
        html = null;
      } catch (err) {
        lastErr = err;
      }
    }
    if (!html) throw lastErr || new Error("no garage source");
    const inject = '<script src="vir-inject.js?v=vir5"><\\/script>';
    const out = html.replace("</body>", inject + "\n</body>");
    document.open();
    document.write(out);
    document.close();
  })().catch((err) => {
    const el = document.getElementById("boot");
    if (el) el.textContent = "Failed to load garage: " + err;
  });
  </script>
</body>
</html>
