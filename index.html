<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi User Car Simulator</title>
  <style>html,body{margin:0;background:#07090d;color:#f2f5f8;font-family:Inter,system-ui,sans-serif}#boot{padding:24px;color:#a6b0bc}</style>
</head>
<body>
  <div id="boot">Loading garage…</div>
  <script>
  (async () => {
    const src = "https://raw.githubusercontent.com/richardjiangs/multi-user-racecar-simulator/28adc8fd90e8bd59c54cf1545c39df0faffd9e60/index.html";
    const html = await fetch(src, { cache: "no-store" }).then((r) => {
      if (!r.ok) throw new Error("hub " + r.status);
      return r.text();
    });
    const inject = '<script src="vir-inject.js"><\/script>';
    const out = html.replace("</body>", inject + "\n</body>");
    document.open();
    document.write(out);
    document.close();
  })().catch((err) => {
    const el = document.getElementById("boot");
    if (el) el.textContent = "Failed to load garage: " + err;
  });
  </script>
</body>
</html>
