<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi User Car Simulator</title>
  <style>html,body{margin:0;background:#07090d;color:#f2f5f8;font-family:Inter,system-ui,sans-serif}#boot{padding:24px;color:#a6b0bc}</style>
</head>
<body>
  <div id="boot">Loading garage…</div>
  <script>
  (async () => {
    const names = [];
    for (let i = 0; i < 8; i++) names.push("hub." + i + ".b64");
    const parts = await Promise.all(names.map((n) => fetch(n + "?v=vir4", { cache: "no-store" }).then((r) => {
      if (!r.ok) throw new Error(n + " " + r.status);
      return r.text();
    })));
    const bin = Uint8Array.from(atob(parts.join("").replace(/\s+/g, "")), (c) => c.charCodeAt(0));
    const ds = new DecompressionStream("gzip");
    const w = ds.writable.getWriter();
    w.write(bin); w.close();
    const html = await new Response(ds.readable).text();
    document.open();
    document.write(html);
    document.close();
  })().catch((err) => {
    const el = document.getElementById("boot");
    if (el) el.textContent = "Failed to load garage: " + err;
  });
  </script>
</body>
</html>
