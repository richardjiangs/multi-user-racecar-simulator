<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi User Car Simulator</title>
  <style>html,body{margin:0;background:#07090d;color:#f2f5f8;font-family:Inter,system-ui,sans-serif}#boot{padding:24px;color:#a6b0bc}</style>
</head>
<body>
  <div id="boot">Loading garage…</div>
  <script>
  (async () => {
    const n = 9;
    const parts = [];
    for (let i = 0; i < n; i++) {
      const name = "hub/p" + String(i).padStart(2, "0") + ".htmlpart";
      parts.push(fetch(name, { cache: "no-store" }).then((r) => {
        if (!r.ok) throw new Error(name + " " + r.status);
        return r.text();
      }));
    }
    const html = (await Promise.all(parts)).join("");
    document.open();
    document.write(html);
    document.close();
  })().catch((err) => {
    const el = document.getElementById("boot");
    if (el) el.textContent = "Failed to load garage: " + err;
  });
  </script>
</body>
</html>
