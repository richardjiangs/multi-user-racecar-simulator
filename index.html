<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Multi User Car Simulator</title>
  <style>html,body{margin:0;background:#07090d;color:#f2f5f8;font:16px/1.45 Inter,system-ui,sans-serif}</style>
</head>
<body>
  <p id="boot" style="padding:24px">Loading garage…</p>
  <script>
    (async () => {
      const SHA = "2f5533437495673812bd1b6fb9afd52c3f42eb87";
      const RAW = "https://raw.githubusercontent.com/richardjiangs/multi-user-racecar-simulator/" + SHA + "/index.html";
      const res = await fetch(RAW, { cache: "no-cache" });
      if (!res.ok) throw new Error("Could not load garage (" + res.status + ")");
      let html = await res.text();

      html = html.replace(
        '[data-car-card="solusgt"] .photo > svg { width:100%; height:100%; display:block; }',
        '[data-car-card="solusgt"] .photo > svg { width:100%; height:100%; display:block; }\n    .photo > svg { width:100%; height:100%; display:block; background:#10141c; }'
      );

      const hook = `\n      function applyDefaultMapLightsOff() {\n        const tryApply = () => {\n          const app = getSimApp();\n          if (!app || !app.state) return false;\n          app.state.ambient = false;\n          // Phantom: Starlight Headliner + The Gallery stay on by default.\n          try {\n            const doc = simFrame.contentDocument;\n            if (doc) {\n              const b = doc.getElementById("ambientBtn");\n              if (b) b.classList.remove("active");\n            }\n            if (typeof app.setActive === "function") {\n              try { app.setActive("ambientBtn", false); } catch (err) {}\n            }\n          } catch (err) {}\n          return true;\n        };\n        if (tryApply()) return;\n        const t0 = Date.now();\n        const poll = setInterval(() => {\n          if (tryApply() || Date.now() - t0 > 8000) clearInterval(poll);\n        }, 50);\n      }\n      function loadEmbeddedSim(car, onLoad) {\n        simFrame.onload = () => { attachFrameShortcuts(); applyDefaultMapLightsOff(); if (typeof onLoad === "function") onLoad(); };`;

      html = html.replace(
        'function loadEmbeddedSim(car, onLoad) {\n        simFrame.onload = () => { attachFrameShortcuts(); if (typeof onLoad === "function") onLoad(); };',
        hook
      );

      document.open();
      document.write(html);
      document.close();
    })().catch((err) => {
      const el = document.getElementById("boot");
      if (el) el.textContent = "Failed to load garage: " + err;
    });
  </script>
</body>
</html>
