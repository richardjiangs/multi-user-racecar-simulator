<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="SSC Tuatara production cockpit: digital driver display, twin centre vents and portrait touchscreen" data-hand-drawn="ssc-production-cabin">
  <defs>
    <linearGradient id="sscSuede" x2="0" y2="1"><stop stop-color="#3b3836"/><stop offset=".5" stop-color="#211f1e"/><stop offset="1" stop-color="#111213"/></linearGradient>
    <linearGradient id="sscMetal" x2=".7" y2="1"><stop stop-color="#e3e5e5"/><stop offset=".27" stop-color="#8c949a"/><stop offset=".5" stop-color="#d9dfe2"/><stop offset="1" stop-color="#40494e"/></linearGradient>
    <linearGradient id="sscGlass" x2=".4" y2="1"><stop stop-color="#16232a"/><stop offset="1" stop-color="#050a0e"/></linearGradient>
    <pattern id="sscWeave" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#14181b"/><path d="M0 0L8 8M-4 0L4 8M4 0L12 8" stroke="#262b2e" stroke-width="2"/></pattern>
    <pattern id="sscMesh" width="8" height="7" patternUnits="userSpaceOnUse"><path d="M2 0H6L8 3.5 6 7H2L0 3.5Z" fill="#090d0f" stroke="#3d4447" stroke-width=".7"/></pattern>
    <g id="sscVent"><circle r="33" fill="url(#sscMetal)" stroke="#111519" stroke-width="5"/><circle r="24" fill="url(#sscMesh)" stroke="#78838a" stroke-width="2"/><path d="M-21 -3H21M0 -23V23" stroke="#687378" stroke-width="3"/><g fill="#0a0e10"><circle cy="-28" r="1.5"/><circle cx="28" r="1.5"/><circle cy="28" r="1.5"/><circle cx="-28" r="1.5"/></g></g>
    <g id="sscShield"><path d="M-14 -18Q0 -24 14 -18L11 7 0 19 -11 7Z" fill="#dce1e4" stroke="#89949b"/><path d="M-10 -15H0V-6H10V3H0V12L-8 4V-6H0V-15" fill="#111519"/><text y="-25" text-anchor="middle" fill="#eee" font-size="7" letter-spacing="2">SSC</text></g>
  </defs>
  <style>[data-control]{cursor:pointer;outline:none}[data-control]:focus-visible{filter:drop-shadow(0 0 4px #82dfff)}[data-control]:hover{filter:brightness(1.4)}[data-control][aria-pressed="true"] .touch-face{stroke:#ed713e;fill:#30241e}text{font-family:Arial,sans-serif;user-select:none}</style>
  <!-- Low, wide windscreen above the stitched passenger dashboard. -->
  <rect width="1000" height="470" fill="#0a0e12"/>
  <path d="M66 0H934L979 117Q771 89 526 98T21 134Z" fill="url(#sscGlass)"/>
  <path d="M98 0L135 93 90 115 49 0M889 0L863 89 905 104 951 0" fill="#202324" stroke="#575653" stroke-width="2"/>
  <path d="M0 129Q159 60 397 83Q501 88 563 115Q737 89 1000 122V470H0Z" fill="url(#sscSuede)"/>
  <path d="M18 146Q182 77 394 103Q489 109 544 137Q761 105 981 140" fill="none" stroke="#b75733" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M660 143Q805 121 996 164L1000 220Q804 190 681 203Z" fill="url(#sscWeave)" stroke="#51585a"/>
  <path d="M677 207Q804 196 1000 228" fill="none" stroke="url(#sscMetal)" stroke-width="5"/>
  <path d="M700 252Q846 246 1000 281M704 258Q846 252 1000 287" fill="none" stroke="#a24b31" stroke-width="2"/>
  <text x="811" y="177" fill="#b5b6b4" font-size="14" letter-spacing="5" transform="rotate(3 811 177)">TUATARA</text>
  <use href="#sscVent" x="51" y="179"/>
  <!-- One angular HMI, set behind the steering wheel. -->
  <path d="M132 111Q257 73 418 102L458 136 438 250 120 252 99 160Z" fill="url(#sscWeave)" stroke="#626667" stroke-width="3"/>
  <path d="M139 121L401 114 431 139 418 241 132 240 117 159Z" fill="#04090d" stroke="#282f33" stroke-width="5"/>
  <path d="M176 191Q181 123 279 126Q370 126 393 170" fill="none" stroke="#334047" stroke-width="16"/>
  <g id="cabRevSegs" data-on="#e4eef1" data-off="#2c383f" data-red=".88" data-redcol="#fb5146" data-redoff="#402626">__TACH_SEGMENTS__</g>
  <g fill="#b8c4ca" font-size="9" text-anchor="middle"><text x="181" y="163">1</text><text x="205" y="140">2</text><text x="239" y="123">3</text><text x="280" y="121">4</text><text x="320" y="123">5</text><text x="354" y="135">6</text><text x="378" y="153">7</text><text x="396" y="176" fill="#fc5c4d">8</text></g>
  <g stroke="#8da1ad" stroke-width="3"><path d="M136 164L164 159M139 177L166 172M142 190L167 185"/></g>
  <g font-size="8" fill="#9aabb4"><text x="138" y="157">BOOST</text><text id="sscBoostArt" x="141" y="206">0.0 BAR</text><text x="360" y="201">OIL °C</text><text id="sscOilArt" x="376" y="217" fill="#e5edef">90</text></g>
  <text id="cabGearArt" x="279" y="185" font-size="50" font-weight="600" fill="#ef513d" text-anchor="middle">N</text>
  <text id="cabSpeedArt" x="280" y="220" font-size="28" fill="#f2f6f7" text-anchor="middle">0</text>
  <text x="315" y="220" font-size="8" fill="#9eacb6">km/h</text>
  <text id="cabRpmArt" x="210" y="235" fill="#aebec7" font-size="9">0</text><text x="247" y="235" fill="#6c808d" font-size="8">RPM</text>
  <text id="sscFuelArt" x="377" y="233" fill="#ebb67e" font-size="8">91 OCT</text>
  <!-- Twin metallic circular vents above a portrait console; the circles are vents, not dials. -->
  <path d="M501 111Q565 97 643 113L671 177 651 218 499 213 479 174Z" fill="url(#sscWeave)" stroke="#747b7d" stroke-width="2"/>
  <use href="#sscVent" x="527" y="157"/><use href="#sscVent" x="615" y="157"/>
  <path d="M565 126L577 126 583 185 559 185Z" fill="#21272b" stroke="#4c5559"/>
  <path d="M499 213L647 214 704 459 478 459Z" fill="url(#sscWeave)" stroke="#3c454a" stroke-width="3"/>
  <path d="M502 211L491 456M647 213L693 456" stroke="url(#sscMetal)" stroke-width="11"/>
  <path d="M518 225H630L668 426H508Z" fill="#04080c" stroke="#444f58" stroke-width="2"/>
  <text x="574" y="244" text-anchor="middle" fill="#dce4e8" font-size="10" letter-spacing="3">TUATARA</text>
  <path d="M559 265Q577 255 590 269L600 333Q581 348 559 336L553 279Z" fill="#292f34" stroke="#87949c"/>
  <path d="M561 278L585 278 590 296H560ZM560 318H594L597 331H562Z" fill="#09131c" stroke="#63727e"/>
  <path d="M548 277V291M595 278V292M552 318V334M606 318V334" stroke="#b5c1c7" stroke-width="5"/>
  <text x="527" y="271" fill="#91a0a9" font-size="7">COOLANT</text><text id="sscWaterArt" x="528" y="283" fill="#e6edf1" font-size="9">88°C</text>
  <g data-control="liftBtn" role="button" tabindex="0" aria-label="Toggle front axle lift"><rect class="touch-face" x="615" y="302" width="29" height="33" rx="4" fill="#141d24" stroke="#445661"/><path d="M622 320H638M630 317V308M626 312L630 307 634 312" fill="none" stroke="#c8d4dd"/><text x="629" y="331" text-anchor="middle" fill="#dce8f0" font-size="6">LIFT</text></g>
  <g data-control="modeBtn" role="button" tabindex="0" aria-label="Cycle driving mode"><rect class="touch-face" x="526" y="352" width="113" height="25" rx="3" fill="#1e2529" stroke="#596369"/><text id="sscModeArt" x="583" y="368" text-anchor="middle" fill="#efb295" font-size="10">RACE</text></g>
  <g data-control="coolBtn" role="button" tabindex="0" aria-label="Toggle climate air conditioning"><rect class="touch-face" x="526" y="384" width="50" height="28" rx="3" fill="#101e29" stroke="#526571"/><text x="551" y="402" text-anchor="middle" fill="#d7e6ef" font-size="10">A/C</text></g>
  <g data-control="audioBtn" role="button" tabindex="0" aria-label="Toggle cabin audio"><rect class="touch-face" x="583" y="384" width="64" height="28" rx="3" fill="#141e25" stroke="#526571"/><text x="615" y="402" text-anchor="middle" fill="#d7e6ef" font-size="10">AUDIO</text></g>
  <g data-control="startSwitchBtn" role="button" tabindex="0" aria-label="Toggle engine ignition"><circle cx="581" cy="444" r="15" fill="#191f23" stroke="url(#sscMetal)" stroke-width="3"/><text x="581" y="446" text-anchor="middle" fill="#f3946f" font-size="6">START</text></g>
  <!-- Column paddles, sculpted three-spoke wheel, stitched suede and SSC shield. -->
  <g data-control="downPaddle" role="button" tabindex="0" aria-label="Downshift"><path d="M139 258Q121 300 141 340L159 334 158 260Z" fill="url(#sscMetal)"/><text x="140" y="281" fill="#111820" font-size="16">−</text></g>
  <g data-control="upPaddle" role="button" tabindex="0" aria-label="Upshift"><path d="M420 258Q438 300 418 340L400 334 401 260Z" fill="url(#sscMetal)"/><text x="412" y="281" fill="#111820" font-size="16">+</text></g>
  <g id="cabinWheelG" transform="translate(280,335)">
    <path d="M-68 -90Q0 -106 68 -90Q119 -61 124 -7Q131 51 74 94L-74 94Q-131 51 -124 -7Q-119 -61 -68 -90Z" fill="none" stroke="#080b0d" stroke-width="29"/>
    <path d="M-68 -90Q0 -106 68 -90Q119 -61 124 -7Q131 51 74 94L-74 94Q-131 51 -124 -7Q-119 -61 -68 -90Z" fill="none" stroke="#41372f" stroke-width="20"/>
    <path d="M-69 -85Q0 -101 69 -85M-113 -26Q-136 41 -70 87H70Q136 41 113 -26" fill="none" stroke="#ac6042" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M-4 -107V-85" stroke="#ed794b" stroke-width="7"/>
    <path d="M-116 -14L-34 -26H34L116 -14 115 8 39 18 25 83H-25L-39 18 -115 8Z" fill="url(#sscMetal)" stroke="#424b50" stroke-width="2"/>
    <path d="M-52 -30Q0 -43 52 -30L44 12 0 51 -44 12Z" fill="#161b20" stroke="#626b71" stroke-width="2"/>
    <path d="M-42 -27Q0 -34 42 -27" stroke="#af694b" fill="none" stroke-dasharray="3 2"/>
    <use href="#sscShield" y="0"/>
    <g id="sscShiftLights" transform="translate(-25,-94)">__SHIFT_LIGHTS__</g>
    <path d="M-18 58H18L13 73H-13Z" fill="#0d151c"/>
  </g>
</svg>
